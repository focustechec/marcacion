<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Marcación</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #f4f6f9; color: #1f2937;
         display: flex; justify-content: center; min-height: 100vh; }
  .card { width: 100%; max-width: 420px; padding: 32px 20px; text-align: center; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  .sub { color: #6b7280; margin-bottom: 24px; font-size: 15px; }
  .btn { display: block; width: 100%; padding: 22px; font-size: 20px; font-weight: 600; border: 0;
         border-radius: 16px; color: #fff; background: #2563eb; cursor: pointer; }
  .btn.sec { background: #374151; margin-top: 12px; font-size: 17px; padding: 16px; }
  img.prev { width: 160px; height: 160px; object-fit: cover; border-radius: 50%; margin: 10px auto; display: none; }
  .res { margin-top: 18px; padding: 18px; border-radius: 14px; font-size: 18px; display: none; }
  .res.ok { background: #16a34a; color: #fff; }
  .res.err { background: #dc2626; color: #fff; }
  .res small { display: block; font-size: 13px; opacity: .9; margin-top: 6px; }
  .spin { display: none; margin: 18px auto; width: 42px; height: 42px; border: 4px solid #cbd5e1;
          border-top-color: #2563eb; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="titulo">Marcación</h1>
  <div class="sub">Toma una foto de tu rostro con buena luz</div>

  <img id="prev" class="prev" alt="">
  <button id="btnFoto" class="btn">📷 Tomar foto</button>
  <input id="cam" type="file" accept="image/*" capture="user">

  <div id="spin" class="spin"></div>
  <div id="res" class="res"></div>
  <button id="btnOtra" class="btn sec" style="display:none">Intentar de nuevo</button>
</div>

<script>
  // ⬇️ URL de tu implementación de Apps Script (termina en /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZb0O8slRyM7P3VZANTHByCQXHg7N6HUHaEbYD-FWszXFhRkgGAUl-HWBTPzwzSfCDbQ/exec";

  const P = Object.fromEntries(new URLSearchParams(location.search));
  const modo = P.modo === 'salida' ? 'salida' : 'entrada';
  const $ = id => document.getElementById(id);
  $('titulo').textContent = modo === 'entrada' ? 'Marcar ENTRADA' : 'Marcar SALIDA';

  $('btnFoto').onclick = () => $('cam').click();
  $('btnOtra').onclick = () => { reset(); $('cam').click(); };

  $('cam').onchange = async ev => {
    const file = ev.target.files[0];
    if (!file) return;
    const dataUrl = await reducir(file, 800, 0.8);
    $('prev').src = dataUrl; $('prev').style.display = 'block';
    $('btnFoto').style.display = 'none';
    $('spin').style.display = 'block';

    try {
      const resp = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ modo: modo, email: P.email, token: P.token,
                               lat: P.lat, lng: P.lng, foto: dataUrl })
      });
      mostrar(await resp.json());
    } catch (e) {
      mostrar({ ok: false, motivo: 'Error de conexión. Revisa tu internet e intenta de nuevo.' });
    }
  };

  function mostrar(r) {
    $('spin').style.display = 'none';
    const box = $('res');
    box.style.display = 'block';
    if (r.ok) {
      box.className = 'res ok';
      box.innerHTML = '✅ ' + r.mensaje + '<small>' + r.detalle + '</small><small>Ya puedes volver a la app</small>';
    } else {
      box.className = 'res err';
      box.textContent = '❌ ' + r.motivo;
      $('btnOtra').style.display = 'block';
    }
  }

  function reset() {
    $('res').style.display = 'none'; $('btnOtra').style.display = 'none';
    $('prev').style.display = 'none'; $('cam').value = '';
  }

  function reducir(file, max, calidad) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', calidad));
      };
      img.src = URL.createObjectURL(file);
    });
  }
</script>
</body>
</html>
